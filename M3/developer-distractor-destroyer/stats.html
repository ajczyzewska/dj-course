<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Statistics - Developer Distractor Destroyer</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .main-container {
            width: 100%;
            max-width: 1400px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .filters-container {
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: center;
            justify-content: space-between;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .filter-group label {
            font-size: 14px;
            font-weight: 600;
            opacity: 0.9;
        }

        .filter-group select,
        .filter-group input {
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 14px;
            outline: none;
        }

        .filter-group select:focus,
        .filter-group input:focus {
            border-color: rgba(255, 255, 255, 0.6);
            background: rgba(255, 255, 255, 0.3);
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
            font-weight: 600;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .btn-primary {
            background: rgba(76, 175, 80, 0.7);
        }

        .btn-primary:hover {
            background: rgba(76, 175, 80, 0.9);
        }

        .btn-danger {
            background: rgba(244, 67, 54, 0.7);
        }

        .btn-danger:hover {
            background: rgba(244, 67, 54, 0.9);
        }

        .container {
            text-align: center;
            width: 100%;
            padding: 40px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: row;
            gap: 40px;
            align-items: flex-start;
        }

        .icon {
            font-size: 80px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 48px;
            margin: 0 0 20px 0;
            font-weight: 700;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        h2 {
            font-size: 24px;
            margin: 0 0 30px 0;
            font-weight: 400;
            opacity: 0.9;
        }

        .stats-column {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .chart-container {
            position: relative;
            margin: auto;
            height: 40vh;
            width: 100%;
            max-width: 400px;
            max-height: 400px;
            margin-bottom: 20px;
        }

        .stats-list {
            width: 100%;
            max-height: 40vh;
            overflow-y: auto;
            margin-top: 20px;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 18px;
            background: rgba(255,255,255,0.1);
            border-radius: 8px;
            margin-bottom: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .stat-item:hover, .stat-item.highlighted {
            background: rgba(255,255,255,0.3);
        }

        .stat-item.disabled {
            text-decoration: line-through;
            opacity: 0.6;
        }
        .value-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .delete-stat-btn {
            cursor: pointer;
            font-size: 14px;
            opacity: 0.7;
            transition: opacity 0.2s;
        }
        .delete-stat-btn:hover {
            opacity: 1;
        }
        .clear-btn {
            cursor: pointer;
            margin-top: 20px;
            font-size: 16px;
            opacity: 0.8;
            transition: opacity 0.2s;
        }
        .clear-btn:hover {
            opacity: 1;
        }

        .scrollbar::-webkit-scrollbar {
            width: 8px;
        }

        .scrollbar::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        .scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 10px;
        }

        .scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.5);
        }

        #fileInput {
            display: none;
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="filters-container">
            <div class="filter-group">
                <label for="periodType">Okres:</label>
                <select id="periodType">
                    <option value="all">Wszystkie dane</option>
                    <option value="day">Dzień</option>
                    <option value="week">Tydzień</option>
                    <option value="month">Miesiąc</option>
                    <option value="custom">Zakres dat</option>
                </select>
            </div>

            <div class="filter-group" id="dateRangeGroup" style="display: none;">
                <label for="startDate">Od:</label>
                <input type="date" id="startDate">
            </div>

            <div class="filter-group" id="dateRangeGroupEnd" style="display: none;">
                <label for="endDate">Do:</label>
                <input type="date" id="endDate">
            </div>

            <div class="action-buttons">
                <button id="applyFilter" class="btn btn-primary">Zastosuj filtr</button>
                <button id="exportData" class="btn">Eksportuj JSON</button>
                <button id="importData" class="btn">Importuj JSON</button>
                <input type="file" id="fileInput" accept=".json">
            </div>
        </div>

        <div class="container">
        <div class="stats-column">
            <h1>📊 Time Statistics</h1>
            <h2>Time spent per domain</h2>
            <div class="chart-container">
                <canvas id="timeChart"></canvas>
            </div>
            <div id="statsList" class="stats-list scrollbar"></div>
            <div id="clearTimeStats" class="clear-btn">
                ❌ Clear Time Statistics
            </div>
        </div>

        <div class="stats-column">
            <h1>🫣 "Gotcha" Counter</h1>
            <h2>How many times you tried to access blocked sites</h2>
            <div class="chart-container">
                <canvas id="gotchaChart"></canvas>
            </div>
            <div id="gotchaList" class="stats-list scrollbar"></div>
            <div id="clearGotchaStats" class="clear-btn">
                ❌ Clear "Gotcha" Statistics
            </div>
        </div>
        </div>
    </div>

    <script src="chart.min.js"></script>
    <script src="stats-utils.js"></script>
    <script src="stats.js"></script>
</body>
</html>
