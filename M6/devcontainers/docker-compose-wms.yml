services:
  wms-postgres:
    image: postgres:17-alpine
    container_name: wms-postgres-container
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: strongpassword123
      POSTGRES_DB: deliveroo
    ports:
      - "5432:5432"
    volumes:
      - wms-postgres_data:/var/lib/postgresql/data
      - ./postgres/init-scripts:/docker-entrypoint-initdb.d
    networks:
      - deliveroo-network
    restart: unless-stopped

  wms-api:
    container_name: wms-api-container
    build:
      context: ./wms-api
      dockerfile: Dockerfile
    environment:
      - PORT=3001
      - SERVICE_NAME=wms-api
      - POSTGRES_URL=postgresql+psycopg2://admin:strongpassword123@wms-postgres:5432/deliveroo
      - FLASK_DEBUG=1
    ports:
      - "3001:3001"
    networks:
      - deliveroo-network
    develop:
      watch:
        - action: sync
          path: ./wms-api/src
          target: /app/src
        - action: rebuild
          path: ./wms-api/requirements.txt

  nginx:
    image: nginx:alpine
    container_name: wms-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - deliveroo-network
    depends_on:
      - wms-api

  pgadmin:
    image: dpage/pgadmin4:9.4
    container_name: pgadmin-container
    environment:
      PGADMIN_DEFAULT_EMAIL: pgadmin@example.com
      PGADMIN_DEFAULT_PASSWORD: pgadmin_password
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json
    networks:
      - deliveroo-network
    depends_on:
      - wms-postgres
    restart: unless-stopped

  registry:
    image: registry:2
    container_name: deliveroo-registry
    ports:
      - "5001:5000"
    volumes:
      - registry_data:/var/lib/registry
    environment:
      REGISTRY_HTTP_HEADERS_Access-Control-Allow-Origin: '["*"]'
      REGISTRY_HTTP_HEADERS_Access-Control-Allow-Methods: '["HEAD", "GET", "OPTIONS", "DELETE"]'
      REGISTRY_HTTP_HEADERS_Access-Control-Allow-Headers: '["Authorization", "Accept", "Cache-Control"]'
      REGISTRY_HTTP_HEADERS_Access-Control-Expose-Headers: '["Docker-Content-Digest"]'
    networks:
      - deliveroo-network
    restart: unless-stopped

  registry-ui:
    image: joxit/docker-registry-ui
    container_name: deliveroo-registry-ui
    ports:
      - "8080:80"
    environment:
      REGISTRY_TITLE: Deliveroo Docker Registry
      REGISTRY_URL: http://localhost:5001
      SINGLE_REGISTRY: "true"
      DELETE_IMAGES: "true"
    networks:
      - deliveroo-network
    depends_on:
      - registry
    restart: unless-stopped

networks:
  deliveroo-network:
    driver: bridge

volumes:
  wms-postgres_data:
  pgadmin_data:
  registry_data:
